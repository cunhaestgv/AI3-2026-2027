<svg xmlns="http://www.w3.org/2000/svg" width="680" height="356" viewBox="0 0 680 356" role="img">
<title>Anatomia de um elemento, de um atributo e de um elemento vazio em XML</title>
<desc>Tres exemplos anotados. No primeiro, o elemento preco com o valor 29.99 e decomposto em etiqueta de abertura, valor (no de texto) e etiqueta de fecho. No segundo, o elemento documento tem o atributo id igual a 001, identificando-se o nome do elemento, o nome do atributo e o valor do atributo entre aspas. No terceiro, o elemento img nao tem no de texto: os dados estao todos em atributos e a etiqueta fecha com uma barra no fim.</desc>
<style>
  text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .ts { font-size: 12px; fill: #73726c; }
  .th { font-size: 14px; font-weight: 500; fill: #3d3d3a; }
  .tm { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 20px; fill: #3d3d3a; }
  .tms { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 16px; fill: #3d3d3a; }
  .tteal  { font-size: 12px; font-weight: 500; fill: #04342C; }
  .tcoral { font-size: 12px; font-weight: 500; fill: #4A1B0C; }
  .bar    { stroke-width: 2.5; stroke-linecap: round; }
  .barteal  { stroke: #1D9E75; }
  .barcoral { stroke: #D85A30; }
  .lead   { stroke: #B4B2A9; stroke-width: 1; fill: none; }
  .rule   { stroke: #E3E1D8; stroke-width: 1; }
</style>

<text class="th" x="24" y="24">Elemento</text>
<text class="tteal" x="154" y="40" text-anchor="middle">valor (nó de texto)</text>
<line x1="154" y1="46" x2="154" y2="54" class="lead"/>
<text class="tm" x="40" y="72">&lt;preco&gt;29.99&lt;/preco&gt;</text>
<line x1="40" y1="82" x2="124" y2="82" class="bar barteal"/>
<line x1="184" y1="82" x2="280" y2="82" class="bar barteal"/>
<text class="tteal" x="82" y="100" text-anchor="middle">etiqueta de abertura</text>
<text class="tteal" x="232" y="100" text-anchor="middle">etiqueta de fecho</text>

<line x1="24" y1="122" x2="656" y2="122" class="rule"/>

<text class="th" x="24" y="150">Atributo</text>
<text class="tcoral" x="100" y="166" text-anchor="middle">nome do elemento</text>
<line x1="100" y1="172" x2="100" y2="180" class="lead"/>
<text class="tm" x="40" y="198">&lt;documento id="001"&gt;</text>
<line x1="172" y1="208" x2="196" y2="208" class="bar barcoral"/>
<line x1="208" y1="208" x2="268" y2="208" class="bar barcoral"/>
<line x1="184" y1="212" x2="184" y2="220" class="lead"/>
<line x1="238" y1="212" x2="238" y2="220" class="lead"/>
<text class="tcoral" x="184" y="234" text-anchor="middle">nome</text>
<text class="tcoral" x="238" y="234" text-anchor="middle">valor, sempre entre aspas</text>

<line x1="24" y1="252" x2="656" y2="252" class="rule"/>

<text class="th" x="24" y="280">Elemento vazio</text>
<text class="tms" x="40" y="308">&lt;img src="smiley.gif" alt="Smiley face"/&gt;</text>
<line x1="424" y1="316" x2="443" y2="316" class="bar barcoral"/>
<text class="ts" x="466" y="296">não tem nó de texto: os dados estão</text>
<text class="ts" x="466" y="312">nos atributos e a etiqueta fecha com /</text>
</svg>
