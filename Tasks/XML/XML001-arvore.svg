<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" role="img">
<title>Representacao em arvore de um documento XML de uma livraria</title>
<desc>O elemento raiz bookstore tem como filho o elemento book, que tem o atributo category. O elemento book tem quatro elementos filhos, irmaos entre si: title, author, year e price. O elemento title tem o atributo lang. Cada um dos quatro elementos terminais tem um no de texto com os dados: Everyday Italian, Giada De Laurentiis, 2005 e 30.00.</desc>
<style>
  text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .ts { font-size: 11px; fill: #73726c; }
  .th { font-size: 14px; font-weight: 500; fill: #3d3d3a; }
  .tm { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #3d3d3a; }
  .tmt { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #04342C; }
  .tmc { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #4A1B0C; }
  .tteal  { font-size: 11px; font-weight: 500; fill: #04342C; }
  .tcoral { font-size: 11px; font-weight: 500; fill: #4A1B0C; }
  .tsl { font-size: 11px; font-weight: 500; fill: #73726c; }
  .box    { fill: #ffffff; stroke: #B4B2A9; stroke-width: 0.5; }
  .lane   { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .bteal  { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .bcoral { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .arr    { stroke: #73726c; stroke-width: 1.5; fill: none; }
  .link   { stroke: #B4B2A9; stroke-width: 1; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect class="lane" x="268" y="16" width="144" height="46" rx="8"/>
<text class="ts" x="340" y="34" text-anchor="middle">Elemento raiz</text>
<text class="tm" x="340" y="52" text-anchor="middle">&lt;bookstore&gt;</text>

<line x1="340" y1="62" x2="340" y2="108" class="link"/>
<line x1="316" y1="102" x2="316" y2="70" class="arr" marker-end="url(#arrow)"/>
<text class="tsl" x="310" y="90" text-anchor="end">Parent</text>
<line x1="364" y1="70" x2="364" y2="102" class="arr" marker-end="url(#arrow)"/>
<text class="tsl" x="370" y="90">Child</text>

<rect class="box" x="268" y="108" width="144" height="46" rx="8"/>
<text class="ts" x="340" y="126" text-anchor="middle">Elemento</text>
<text class="tm" x="340" y="144" text-anchor="middle">&lt;book&gt;</text>

<line x1="412" y1="131" x2="504" y2="131" class="link"/>
<rect class="bcoral" x="504" y="108" width="148" height="46" rx="8"/>
<text class="tcoral" x="578" y="126" text-anchor="middle">Atributo</text>
<text class="tmc" x="578" y="144" text-anchor="middle">category</text>

<rect class="bcoral" x="12" y="108" width="148" height="46" rx="8"/>
<text class="tcoral" x="86" y="126" text-anchor="middle">Atributo</text>
<text class="tmc" x="86" y="144" text-anchor="middle">lang</text>
<line x1="86" y1="154" x2="86" y2="226" class="link"/>

<line x1="340" y1="154" x2="340" y2="194" class="link"/>
<line x1="86" y1="194" x2="578" y2="194" class="link"/>
<line x1="250" y1="194" x2="250" y2="226" class="link"/>
<line x1="414" y1="194" x2="414" y2="226" class="link"/>
<line x1="578" y1="194" x2="578" y2="226" class="link"/>

<text class="tsl" x="168" y="211" text-anchor="middle">Siblings</text>
<line x1="100" y1="216" x2="236" y2="216" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<rect class="box" x="12" y="226" width="148" height="46" rx="8"/>
<text class="ts" x="86" y="244" text-anchor="middle">Elemento</text>
<text class="tm" x="86" y="262" text-anchor="middle">&lt;title&gt;</text>

<rect class="box" x="176" y="226" width="148" height="46" rx="8"/>
<text class="ts" x="250" y="244" text-anchor="middle">Elemento</text>
<text class="tm" x="250" y="262" text-anchor="middle">&lt;author&gt;</text>

<rect class="box" x="340" y="226" width="148" height="46" rx="8"/>
<text class="ts" x="414" y="244" text-anchor="middle">Elemento</text>
<text class="tm" x="414" y="262" text-anchor="middle">&lt;year&gt;</text>

<rect class="box" x="504" y="226" width="148" height="46" rx="8"/>
<text class="ts" x="578" y="244" text-anchor="middle">Elemento</text>
<text class="tm" x="578" y="262" text-anchor="middle">&lt;price&gt;</text>

<line x1="86" y1="272" x2="86" y2="300" class="link"/>
<line x1="250" y1="272" x2="250" y2="300" class="link"/>
<line x1="414" y1="272" x2="414" y2="300" class="link"/>
<line x1="578" y1="272" x2="578" y2="300" class="link"/>

<rect class="bteal" x="12" y="300" width="148" height="56" rx="8"/>
<text class="tteal" x="86" y="318" text-anchor="middle">Texto</text>
<text class="tmt" x="86" y="338" text-anchor="middle">Everyday Italian</text>

<rect class="bteal" x="176" y="300" width="148" height="56" rx="8"/>
<text class="tteal" x="250" y="318" text-anchor="middle">Texto</text>
<text class="tmt" x="250" y="334" text-anchor="middle">Giada De</text>
<text class="tmt" x="250" y="348" text-anchor="middle">Laurentiis</text>

<rect class="bteal" x="340" y="300" width="148" height="56" rx="8"/>
<text class="tteal" x="414" y="318" text-anchor="middle">Texto</text>
<text class="tmt" x="414" y="338" text-anchor="middle">2005</text>

<rect class="bteal" x="504" y="300" width="148" height="56" rx="8"/>
<text class="tteal" x="578" y="318" text-anchor="middle">Texto</text>
<text class="tmt" x="578" y="338" text-anchor="middle">30.00</text>

<text class="ts" x="340" y="380" text-anchor="middle">Os elementos terminais (folhas) guardam os dados num nó de texto ou, em alternativa, em atributos.</text>
</svg>
